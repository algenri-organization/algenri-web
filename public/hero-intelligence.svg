<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" fill="none">
  <defs>
    <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 320) rotate(145) scale(650 520)">
      <stop stop-color="#123C79" stop-opacity=".62"/>
      <stop offset=".42" stop-color="#0D2146" stop-opacity=".3"/>
      <stop offset="1" stop-color="#07111F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" x1="410" y1="110" x2="780" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF"/>
      <stop offset=".46" stop-color="#2563FF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="line" x1="520" y1="180" x2="910" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF"/>
      <stop offset=".52" stop-color="#4F8CFF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="earth" x1="770" y1="560" x2="1120" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20D8FF"/>
      <stop offset=".5" stop-color="#2563FF"/>
      <stop offset="1" stop-color="#081426" stop-opacity=".2"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <clipPath id="earthClip"><circle cx="1045" cy="790" r="265"/></clipPath>
  </defs>

  <rect width="1200" height="820" fill="url(#bg)"/>
  <circle cx="760" cy="315" r="300" fill="#1559A9" fill-opacity=".08" filter="url(#soft)"/>

  <!-- Human profile -->
  <path d="M702 90c-118 8-216 86-248 194-15 50-12 101 4 149 10 31 4 58-18 83-22 25-49 46-64 72-11 19-8 40 11 53 18 12 50 10 78 13 23 2 35 14 36 35l3 52c2 35 24 57 60 57h73c27 0 52-12 71-31 37-37 57-90 70-149 10-43 24-75 56-105 46-44 75-106 75-174 0-151-122-259-276-249Z" fill="#04101D" fill-opacity=".25" stroke="url(#face)" stroke-width="3.2"/>
  <path d="M454 284c32-108 130-186 248-194 111-8 212 38 266 121" stroke="#00E5FF" stroke-opacity=".24" stroke-width="16" filter="url(#glow)"/>
  <path d="M439 591c40-36 65-79 66-124 1-40-13-77-7-118 11-89 70-160 155-197" stroke="#2563FF" stroke-opacity=".2" stroke-width="28" filter="url(#soft)"/>

  <!-- Neural lattice -->
  <g stroke="url(#line)" stroke-opacity=".52" stroke-width="1.5">
    <path d="M535 240 603 193 669 241 736 191 811 247 868 322 822 397 884 469 820 552 745 514 675 583 599 536 537 571"/>
    <path d="M603 193 636 304 736 191M669 241 636 304 742 343 811 247M742 343 822 397 745 514M742 343 675 455 599 536M675 455 537 571M675 455 636 304M822 397 884 469 745 514M535 240 636 304"/>
    <path d="M553 350 636 304 675 455 570 486 537 571M742 343 675 455 745 514 820 552"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="535" cy="240" r="5" fill="#00E5FF"/><circle cx="603" cy="193" r="4" fill="#66A3FF"/><circle cx="669" cy="241" r="6" fill="#00E5FF"/>
    <circle cx="736" cy="191" r="4" fill="#8B5CF6"/><circle cx="811" cy="247" r="5" fill="#66A3FF"/><circle cx="868" cy="322" r="4" fill="#00E5FF"/>
    <circle cx="742" cy="343" r="7" fill="#fff"/><circle cx="822" cy="397" r="5" fill="#00E5FF"/><circle cx="884" cy="469" r="4" fill="#8B5CF6"/>
    <circle cx="820" cy="552" r="5" fill="#66A3FF"/><circle cx="745" cy="514" r="6" fill="#00E5FF"/><circle cx="675" cy="583" r="4" fill="#8B5CF6"/>
    <circle cx="599" cy="536" r="5" fill="#66A3FF"/><circle cx="537" cy="571" r="4" fill="#00E5FF"/><circle cx="636" cy="304" r="5" fill="#00E5FF"/><circle cx="675" cy="455" r="7" fill="#fff"/>
  </g>

  <!-- Brand-like orbital energy -->
  <g transform="translate(720 360) rotate(-18)" opacity=".92">
    <ellipse rx="275" ry="90" stroke="#00E5FF" stroke-opacity=".32" stroke-width="2"/>
    <ellipse rx="236" ry="64" transform="rotate(62)" stroke="#2563FF" stroke-opacity=".3" stroke-width="2"/>
    <ellipse rx="220" ry="58" transform="rotate(118)" stroke="#8B5CF6" stroke-opacity=".28" stroke-width="2"/>
  </g>

  <!-- Earth horizon -->
  <g clip-path="url(#earthClip)">
    <circle cx="1045" cy="790" r="265" fill="#06111F" stroke="url(#earth)" stroke-width="5"/>
    <circle cx="1045" cy="790" r="248" stroke="#1B74FF" stroke-opacity=".24" stroke-width="18" filter="url(#glow)"/>
    <path d="M796 744c66-38 124-42 182-13 45 23 91 20 136-10 43-28 87-28 133-2M824 684c38 10 72 29 103 58M943 600c7 48 24 92 50 132M1074 559c-5 56 6 106 31 152" stroke="#2EA9FF" stroke-opacity=".24" stroke-width="1.4"/>
    <g fill="#FFB45A" opacity=".78" filter="url(#glow)">
      <circle cx="1010" cy="660" r="2.2"/><circle cx="1068" cy="690" r="1.7"/><circle cx="1112" cy="637" r="1.8"/><circle cx="1160" cy="705" r="2.2"/><circle cx="980" cy="718" r="1.5"/><circle cx="1140" cy="752" r="1.4"/>
    </g>
  </g>

  <g opacity=".6">
    <circle cx="1040" cy="130" r="1.6" fill="#fff"/><circle cx="1090" cy="188" r="2" fill="#00E5FF"/><circle cx="965" cy="158" r="1.2" fill="#8B5CF6"/>
    <circle cx="880" cy="110" r="1.5" fill="#66A3FF"/><circle cx="1140" cy="280" r="1.4" fill="#fff"/><circle cx="930" cy="250" r="1.2" fill="#00E5FF"/>
  </g>
</svg>