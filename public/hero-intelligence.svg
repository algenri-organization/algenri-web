<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" fill="none">
  <defs>
    <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(565 378) rotate(135) scale(500)">
      <stop stop-color="#11386B" stop-opacity=".52"/>
      <stop offset=".46" stop-color="#0C1E42" stop-opacity=".18"/>
      <stop offset="1" stop-color="#07111F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" x1="260" y1="170" x2="650" y2="760" gradientUnits="userSpaceOnUse">
